<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
      $(function () {
        $("#header").load("header.html");
		$("#footer").load("footer.html");
	  });
    </script>
	<link rel="icon" type="image" href="media/icon.svg">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open Sans">
  </head>
  <body>
  <style>
    body{
	  background-image: url('media/background site.svg');
	  background-repeat: no-repeat;
	  background-attachment: fixed;
      background-position: center;
      background-size: 100% auto;
      background-color: #004aad;

    }
	*{
	  font-family: 'Open Sans';
	  color: white;
	}
	
	#title{
	  align-items: center;
	  justify-content: center;
	  text-align: center;
	}
	
	#content{
	  display: block;
	  width: fit-content;
	  align-items: stretch;
	  margin: 10px auto;
	  background-color: #5170ffaa;
	  border-radius: 15px;
	  text-align: left;
	  padding: 10px;
	  min-width: 0;
	}
	
  </style>
	<div id="header"></div>
    <h1 id="title">{{ page.title }}</h1>
    <section id="content">
	  <p>Sample</p>
      {{ content }}
    </section>
    <div id="footer"></div>
  </body>
</html>
