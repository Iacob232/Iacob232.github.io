<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image" href="{{ '/media/icon.svg' | relative_url }}">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open Sans">
  </head>
  <body>
  <style>
	
    body{
	  background-image: url("{{ '/media/background poem.svg' | relative_url }}");
	  background-repeat: no-repeat;
	  background-attachment: fixed;
      background-position: center;
      background-size: 100% auto;
      background-color: #008e1d;
	  margin: 0;
	  padding: 10px;
    }
	
	#title{
	  align-items: center;
	  justify-content: center;
	  text-align: center;
	  font-family: 'Open Sans';
	  color: white;
	}
	
	#container {
	  display: flex;
  	  width: fit-content;
  	  max-width: 100%;
  	  margin: 10px auto;
  	  align-items: stretch;
  	  justify-content: center;
  	  gap: 10px;
	}
	
	#content{
	  display: block;
	  width: fit-content;
	  align-items: stretch;
	  align-self: center;
	  margin: 10px;
	  background-color: #d0d0d0ee;
	  border-radius: 15px;
	  border-left-style: solid;
	  border-left-color: #999999ee;
	  border-left-width: 4px;
	  text-align: left;
	  padding: 10px;
	  min-width: 0;
	  font-family: "Times New Roman";
	  color: black;
	}
	
	#image {
	  display: flex;
	  position: relative;
	  margin: 10px;
	  width: 300px;
	  min-width: 0;
	  align-items: center;
	  justify-content: center;
	}

	#image img {
	  width: 100%;
	  height: auto;
	  max-height: 100%;
	  object-fit: contain;
	  
	}
	
	@media screen and (max-width: 768px){
	
	  body{
		overflow-x: auto;
	  }
  
	  #container{
		flex-direction: column;
		width: auto;
		padding: 10px;
		align-items: center;
	  }
	  
	  #content{
		display: block;
		width: fit-content;
		margin: 10px;
		padding: 10px;
	  }

	  #image img{
	    position: static;
		width: 100%;
		height: auto;
		max-width: 100%;
		align-items: center;
	  }
	}

	
  </style>
	{% include header.html %}
    <h1 id="title">{{ page.title }}</h1>
	<div id="container">
	  <section id="content">
        {{ content }}
      </section>
	  <section id="image">
	    <img src={{ page.image }}>
	  </section>
	</div>
    
    {% include footer.html %}
  </body>
</html>
